<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b0b4a"/><stop offset="0.55" stop-color="#8a2be2"/><stop offset="1" stop-color="#ff7a3d"/>
  </linearGradient>
  <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0.5" stop-color="#eaffb0"/><stop offset="1" stop-color="#eaffb0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff176"/><stop offset="1" stop-color="#ff9800"/>
  </linearGradient>
  <g id="zombie">
    <rect x="-42" y="-90" width="40" height="90" fill="#2d4a9a" stroke="#101030" stroke-width="5"/>
    <rect x="2" y="-90" width="40" height="90" fill="#2d4a9a" stroke="#101030" stroke-width="5"/>
    <rect x="-42" y="-14" width="40" height="14" fill="#3a2a1a"/><rect x="2" y="-14" width="40" height="14" fill="#3a2a1a"/>
    <rect x="-135" y="-195" width="92" height="36" fill="#7ac943" stroke="#101030" stroke-width="5"/>
    <rect x="43" y="-195" width="92" height="36" fill="#7ac943" stroke="#101030" stroke-width="5"/>
    <rect x="-47" y="-200" width="94" height="112" fill="#17a2b8" stroke="#101030" stroke-width="5"/>
    <polygon points="-47,-120 -25,-100 -5,-125 15,-98 47,-120 47,-88 -47,-88" fill="#0e6f80"/>
    <rect x="-42" y="-285" width="84" height="88" fill="#7ac943" stroke="#101030" stroke-width="5"/>
    <rect x="-42" y="-285" width="84" height="22" fill="#4a3320"/>
    <circle cx="-17" cy="-238" r="13" fill="#fff" stroke="#101030" stroke-width="3"/><circle cx="17" cy="-238" r="13" fill="#fff" stroke="#101030" stroke-width="3"/>
    <circle cx="-14" cy="-236" r="5" fill="#d50000"/><circle cx="20" cy="-240" r="5" fill="#d50000"/>
    <path d="M-24,-214 L-16,-206 L-8,-214 L0,-206 L8,-214 L16,-206 L24,-214 L24,-208 L-24,-208 Z" fill="#fff" stroke="#101030" stroke-width="3"/>
    <rect x="-24" y="-214" width="48" height="6" fill="#101030"/>
  </g>
  <g id="hero">
    <rect x="-40" y="-85" width="38" height="85" fill="#263238" stroke="#101030" stroke-width="5"/>
    <rect x="2" y="-85" width="38" height="85" fill="#263238" stroke="#101030" stroke-width="5"/>
    <rect x="-44" y="-195" width="88" height="112" fill="#e53935" stroke="#101030" stroke-width="5"/>
    <rect x="-44" y="-150" width="88" height="14" fill="#ffd23f"/>
    <rect x="-80" y="-195" width="36" height="85" fill="#ffd23f" stroke="#101030" stroke-width="5"/>
    <g transform="rotate(-50 60 -180)">
      <rect x="44" y="-198" width="34" height="85" fill="#ffd23f" stroke="#101030" stroke-width="5"/>
      <rect x="52" y="-340" width="18" height="150" fill="#b57b3b" stroke="#101030" stroke-width="5"/>
      <rect x="46" y="-380" width="30" height="60" rx="4" fill="#c98a45" stroke="#101030" stroke-width="5"/>
      <rect x="46" y="-360" width="30" height="8" fill="#9e9e9e"/><rect x="46" y="-345" width="30" height="8" fill="#9e9e9e"/>
    </g>
    <rect x="-40" y="-280" width="80" height="84" fill="#ffd23f" stroke="#101030" stroke-width="5"/>
    <path d="M-44,-280 L-44,-300 L44,-300 L44,-280 L50,-262 L-50,-262 Z" fill="#6d3b1a" stroke="#101030" stroke-width="4"/>
    <rect x="-24" y="-246" width="12" height="18" fill="#101030"/><rect x="12" y="-246" width="12" height="18" fill="#101030"/>
    <path d="M-22,-222 Q0,-198 22,-222 Z" fill="#fff" stroke="#101030" stroke-width="4"/>
  </g>
</defs>

<rect width="1280" height="720" fill="url(#sky)"/>
<!-- sunburst rays -->
<g transform="translate(640 470)" opacity="0.16" fill="#fff">
  <g id="rays">
    <polygon points="0,0 -60,-1200 60,-1200"/>
    <polygon points="0,0 -60,-1200 60,-1200" transform="rotate(30)"/>
    <polygon points="0,0 -60,-1200 60,-1200" transform="rotate(60)"/>
    <polygon points="0,0 -60,-1200 60,-1200" transform="rotate(90)"/>
    <polygon points="0,0 -60,-1200 60,-1200" transform="rotate(120)"/>
    <polygon points="0,0 -60,-1200 60,-1200" transform="rotate(150)"/>
    <polygon points="0,0 -60,-1200 60,-1200" transform="rotate(180)"/>
    <polygon points="0,0 -60,-1200 60,-1200" transform="rotate(210)"/>
    <polygon points="0,0 -60,-1200 60,-1200" transform="rotate(240)"/>
    <polygon points="0,0 -60,-1200 60,-1200" transform="rotate(270)"/>
    <polygon points="0,0 -60,-1200 60,-1200" transform="rotate(300)"/>
    <polygon points="0,0 -60,-1200 60,-1200" transform="rotate(330)"/>
  </g>
</g>
<!-- moon -->
<circle cx="1060" cy="140" r="170" fill="url(#moon)"/>
<circle cx="1060" cy="140" r="78" fill="#eaffb0" stroke="#b6d96b" stroke-width="6"/>
<circle cx="1035" cy="118" r="14" fill="#c9e68a"/><circle cx="1085" cy="165" r="18" fill="#c9e68a"/><circle cx="1078" cy="108" r="8" fill="#c9e68a"/>
<!-- stars -->
<g fill="#fff"><rect x="120" y="60" width="8" height="8"/><rect x="300" y="120" width="6" height="6"/><rect x="520" y="50" width="8" height="8"/><rect x="760" y="100" width="6" height="6"/><rect x="900" y="40" width="8" height="8"/><rect x="60" y="200" width="6" height="6"/></g>
<!-- city -->
<g fill="#2a0f55">
  <rect x="0" y="380" width="110" height="200"/><rect x="120" y="330" width="90" height="250"/><rect x="220" y="400" width="130" height="180"/>
  <rect x="880" y="360" width="100" height="220"/><rect x="990" y="310" width="120" height="270"/><rect x="1120" y="390" width="160" height="190"/>
</g>
<g fill="#ffe36b"><rect x="140" y="350" width="14" height="14"/><rect x="170" y="390" width="14" height="14"/><rect x="1010" y="335" width="14" height="14"/><rect x="1060" y="380" width="14" height="14"/><rect x="900" y="390" width="14" height="14"/><rect x="20" y="410" width="14" height="14"/></g>
<!-- ground -->
<polygon points="0,560 1280,560 1280,720 0,720" fill="#3b1d6e"/>
<g fill="#4c2a8a"><rect x="0" y="560" width="1280" height="14"/></g>
<g fill="#331660">
  <polygon points="0,600 200,600 160,640 0,640"/><polygon points="400,600 640,600 620,640 380,640"/><polygon points="840,600 1060,600 1090,640 870,640"/>
</g>
<!-- tombstone & pumpkin -->
<g transform="translate(1180 600)"><rect x="-30" y="-80" width="60" height="80" fill="#9e9e9e" stroke="#101030" stroke-width="5"/><text x="0" y="-35" font-family="Arial Black" font-size="24" fill="#555" text-anchor="middle">RIP</text></g>
<g transform="translate(110 610)"><rect x="-32" y="-50" width="64" height="50" fill="#ff8f00" stroke="#101030" stroke-width="5"/><rect x="-6" y="-64" width="12" height="16" fill="#2e7d32"/></g>

<!-- back zombies -->
<use href="#zombie" transform="translate(880 600) scale(0.75)"/>
<use href="#zombie" transform="translate(1040 585) scale(0.62)"/>
<use href="#zombie" transform="translate(300 590) scale(0.7)"/>
<!-- hero -->
<use href="#hero" transform="translate(470 650) rotate(-5)"/>
<!-- front zombie big -->
<g transform="translate(790 720) rotate(4)"><use href="#zombie" transform="scale(1.1)"/></g>

<!-- impact stars -->
<g fill="#fff176" stroke="#101030" stroke-width="4">
  <polygon points="560,330 575,360 610,362 584,383 593,416 560,398 527,416 536,383 510,362 545,360"/>
</g>
<text x="560" y="385" font-family="Arial Black, Impact" font-size="26" fill="#d50000" text-anchor="middle" transform="rotate(-10 560 385)">BAM!</text>

<!-- title -->
<g transform="rotate(-4 640 170)" font-family="Arial Black, Impact, sans-serif" text-anchor="middle" font-weight="900">
  <text x="646" y="176" font-size="120" fill="#101030" stroke="#101030" stroke-width="22" stroke-linejoin="round">ZOMBIE</text>
  <text x="640" y="170" font-size="120" fill="url(#gold)" stroke="#101030" stroke-width="10" stroke-linejoin="round" paint-order="stroke">ZOMBIE</text>
  <text x="646" y="276" font-size="84" fill="#101030" stroke="#101030" stroke-width="18" stroke-linejoin="round">SURVIVAL</text>
  <text x="640" y="270" font-size="84" fill="#76ff03" stroke="#101030" stroke-width="9" stroke-linejoin="round" paint-order="stroke">SURVIVAL</text>
</g>
<!-- badge -->
<g transform="translate(150 120) rotate(-12)"><rect x="-80" y="-30" width="160" height="60" rx="10" fill="#d50000" stroke="#101030" stroke-width="5"/><text x="0" y="12" font-family="Arial Black" font-size="30" fill="#fff" text-anchor="middle">¡NUEVO!</text></g>
</svg>
